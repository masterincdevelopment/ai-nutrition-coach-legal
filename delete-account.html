['Possível conservação',`Só podem ser conservadas informações mínimas quando exigidas por lei ou necessárias para contabilidade, litígios, segurança e prevenção de fraude, pelo período aplicável. Dados de saúde e conteúdos pessoais não são conservados para esses fins. ${privacy}Consultar a Política de privacidade</a>.`],

['Без доступа к приложению',`Напишите с адреса, связанного с аккаунтом, на ${mail} с темой «Удаление аккаунта AI Nutrition Coach». Для проверки личности могут потребоваться ограниченные сведения. Обычно запрос выполняется в течение месяца.`],

['Оператор и контактные данные',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Италия<br>Контакт: ${mail}`]]],

['アカウントを残した部分削除','<b>プロフィール → プライバシーと同意</b>から、健康データとAIパーソナライズへの同意を撤回できます。パーソナライズ用に保存された健康データはプロフィールから削除されますが、アカウント、メール、購読状態、必要な技術データは維持されます。上記メールから特定データの削除も依頼できます。'],
['保存される可能性のある情報',`法令または会計、紛争、安全、不正防止に必要な場合に限り、適用期間中、最小限の情報を保存することがあります。健康データや個人的コンテンツはこれらの目的では保存しません。${privacy}プライバシーポリシーを見る</a>。`],
