it:['Termini di servizio','Versione 1.1 – ultimo aggiornamento: 2 settembre 2026','Lingua',[

const langSelect=document.getElementById('lang'),titleElement=document.getElementById('title'),subtitleElement=document.getElementById('subtitle'),labelElement=document.getElementById('label'),contentElement=document.getElementById('content');
