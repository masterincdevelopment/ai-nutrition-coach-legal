it:['Informativa sulla privacy','Versione 2.3 – 2 settembre 2026','Lingua',[
['1. Età minima','L’app è destinata esclusivamente a persone di almeno 18 anni.'],
['2. Dati trattati','Account (nome, email, identificativo Firebase); profilo, età, sesso, altezza, peso, obiettivi e preferenze; allergie, intolleranze, condizioni dichiarate, attività, allenamenti e sonno; piani, ricette, note, cronologia, preferiti e liste; foto scelte per Snap & Ask; stato dell’abbonamento e identificativi tecnici degli acquisti. Trattiamo inoltre dati tecnici minimizzati: eventi generici, arresti anomali, prestazioni, dispositivo, sistema operativo, versione, identificativi di installazione e token notifiche. La telemetria non riceve nome, email, UID Firebase, peso, dieta, obiettivi o condizioni sanitarie.'],
['3. Finalità e basi giuridiche','Account, sincronizzazione e Premium: esecuzione del contratto (art. 6(1)(b) GDPR). Personalizzazione con dati sanitari e invio alle funzioni AI: consenso esplicito (artt. 6(1)(a) e 9(2)(a)). Firebase Analytics è facoltativo ed è attivato solo con consenso (art. 6(1)(a)); può essere disattivato in qualsiasi momento dal Profilo. Sicurezza, prevenzione abusi e diagnostica strettamente necessaria: legittimo interesse (art. 6(1)(f)). Obblighi legali: art. 6(1)(c). I dati sanitari non sono usati per pubblicità o marketing.'],
['4. AI, fotografie e fornitori','Le funzioni Premium AI possono inviare al backend e a Google Gemini API profilo, preferenze, allergie, informazioni sulla salute, attività, piano, note e foto selezionata. Le risposte sono informative e non costituiscono diagnosi, terapia o prescrizione. Le foto non sono intenzionalmente archiviate dall’app; Google può conservarle temporaneamente secondo i termini applicabili. Usiamo inoltre Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring e Google Play Billing.'],
['5. Trasferimenti, conservazione e sicurezza','Google opera come responsabile per i servizi coperti dagli accordi di trattamento applicabili e può operare come titolare autonomo per alcuni dati tecnici, Analytics e Google Play. Firebase Authentication è erogato dagli Stati Uniti. Gli altri trattamenti fuori dallo SEE avvengono con le garanzie del Capo V GDPR, incluse decisioni di adeguatezza, Data Privacy Framework quando applicabile e Clausole contrattuali standard. Con Gemini associato a un progetto con fatturazione attiva, Google dichiara di non usare prompt e risposte per migliorare i propri prodotti, pur potendoli registrare per un periodo limitato per sicurezza, prevenzione abusi e obblighi legali. Account, profilo, piani e cronologia restano fino alla cancellazione; Analytics per il periodo configurato; Crashlytics normalmente 90 giorni; acquisti quanto necessario per abbonamento, legge, contestazioni e frodi; email di assistenza normalmente non oltre 24 mesi. Usiamo cifratura in transito, autenticazione, regole per utente, segreti backend e minimizzazione.'],
['6. Diritti, revoca e cancellazione',`Puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opposizione. Puoi revocare dal Profilo il consenso sanitario: account e abbonamento restano attivi, mentre dati sanitari, peso, obiettivi, piani e contenuti AI derivati vengono eliminati e le funzioni personalizzate sono bloccate. Puoi acconsentire nuovamente, ma i dati eliminati non sono recuperabili. Elimina account e dati dal Profilo o tramite la ${del}procedura web</a>. Scrivi a ${mail}; di norma rispondiamo entro un mese. Puoi reclamare al <a href="https://www.garanteprivacy.it/">Garante privacy</a>.`],
['7. Consensi e modifiche','Registriamo separatamente la presa visione dell’informativa e il consenso sanitario/AI, con versione, data, ora e lingua. In caso di modifiche sostanziali mostreremo la nuova informativa e, quando necessario, richiederemo nuovamente il consenso.'],
['8. Titolare del trattamento',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italia<br>Contatto privacy: ${mail}`]]],
en:['Privacy Policy','Version 2.3 – 2 September 2026','Language',[
['1. Minimum age','The app is intended exclusively for people aged 18 or older.'],
['2. Data processed','Account (name, email, Firebase identifier); profile, age, sex, height, weight, goals and preferences; allergies, intolerances, declared conditions, activity, workouts and sleep; plans, recipes, notes, history, favourites and lists; photos selected for Snap & Ask; subscription status and technical purchase identifiers. Minimized technical data includes generic events, crashes, performance, device, OS, version, installation identifiers and notification tokens. Telemetry does not receive name, email, Firebase UID, weight, diet, goals or health conditions.'],
['3. Purposes and legal bases','Account, synchronization and Premium: contract performance (GDPR Art. 6(1)(b)). Personalization using health data and sending it to AI features: explicit consent (Arts. 6(1)(a), 9(2)(a)). Firebase Analytics is optional and is enabled only with consent (Art. 6(1)(a)); it can be disabled at any time in Profile. Security, abuse prevention and strictly necessary diagnostics: legitimate interests (Art. 6(1)(f)). Legal duties: Art. 6(1)(c). Health data is not used for advertising or marketing.'],
['4. AI, photographs and providers','Premium AI features may send profile, preferences, allergies, health information, activity, plan, notes and the selected photo to our backend and Google Gemini API. Responses are informational and are not diagnosis, treatment or prescription. Photos are not intentionally stored by the app; Google may retain them temporarily under applicable terms. We also use Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring and Google Play Billing.'],
['5. Transfers, retention and security','Google acts as processor for services covered by the applicable processing agreements and may act as independent controller for certain technical data, Analytics and Google Play. Firebase Authentication is provided from the United States. Other processing outside the EEA uses GDPR Chapter V safeguards, including adequacy decisions, the Data Privacy Framework where applicable and Standard Contractual Clauses. For Gemini linked to a project with active billing, Google states that it does not use prompts and responses to improve its products, although it may log them for a limited period for security, abuse prevention and legal obligations. Account, profile, plans and history remain until deletion; Analytics for the configured period; Crashlytics normally 90 days; purchase data as required for subscriptions, law, disputes and fraud; support email normally no longer than 24 months. We use encryption in transit, authentication, per-user rules, backend secrets and minimization.'],
['6. Rights, withdrawal and deletion',`You may request access, correction, deletion, restriction, portability and objection. You can withdraw health-data consent in Profile: the account and subscription remain active, while health data, weight, goals, plans and derived AI content are deleted and personalized features are blocked. You may consent again, but deleted data cannot be restored. Delete account and data in Profile or through the ${del}web procedure</a>. Contact ${mail}; we normally respond within one month. You may complain to the competent data protection authority.`],
['7. Consent records and changes','We separately record acknowledgement of the notice and health-data/AI consent, including version, date, time and language. For material changes we will display the new notice and request consent again where required.'],
['8. Data controller',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italy<br>Privacy contact: ${mail}`]]],
es:['Política de privacidad','Versión 2.3 – 2 de septiembre de 2026','Idioma',[

['2. Datos tratados','Cuenta; perfil, edad, sexo, altura, peso, objetivos y preferencias; alergias, intolerancias, condiciones declaradas, actividad, entrenamientos y sueño; planes, recetas, notas, historial, favoritos y listas; fotos para Snap & Ask; suscripción e identificadores técnicos de compra. Datos técnicos minimizados: eventos genéricos, fallos, rendimiento, dispositivo, sistema, versión, instalación y tokens. La telemetría no recibe nombre, email, UID Firebase, peso, dieta, objetivos ni salud.'],
['3. Finalidades y bases','Cuenta, sincronización y Premium: contrato (art. 6.1.b RGPD). Datos de salud y funciones IA: consentimiento explícito (arts. 6.1.a y 9.2.a). Firebase Analytics es opcional y solo se activa con consentimiento (art. 6.1.a); puede desactivarse en cualquier momento desde el Perfil. Seguridad, prevención de abusos y diagnóstico estrictamente necesario: interés legítimo (art. 6.1.f). Obligaciones legales: art. 6.1.c. No usamos datos de salud para publicidad o marketing.'],
['4. IA, fotos y proveedores','Las funciones Premium de IA pueden enviar perfil, preferencias, alergias, salud, actividad, plan, notas y foto al backend y Google Gemini API. Las respuestas son informativas, no diagnóstico, tratamiento ni prescripción. La app no almacena intencionadamente las fotos; Google puede conservarlas temporalmente. Usamos también Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring y Google Play Billing.'],
['5. Transferencias, conservación y seguridad','Google actúa como encargado en los servicios cubiertos por los acuerdos aplicables y puede actuar como responsable independiente para ciertos datos técnicos, Analytics y Google Play. Firebase Authentication se presta desde Estados Unidos. Los demás tratamientos fuera del EEE utilizan las garantías del capítulo V del RGPD, incluidas decisiones de adecuación, el Data Privacy Framework cuando proceda y Cláusulas Contractuales Tipo. Con Gemini vinculado a un proyecto con facturación activa, Google declara que no usa solicitudes y respuestas para mejorar sus productos, aunque puede registrarlas temporalmente por seguridad, prevención de abusos y obligaciones legales. Cuenta, perfil, planes e historial hasta su eliminación; Analytics según configuración; Crashlytics normalmente 90 días; compras según necesidades legales, de suscripción, disputas y fraude; soporte normalmente hasta 24 meses. Usamos cifrado, autenticación, reglas por usuario, secretos backend y minimización.'],
['6. Derechos, retirada y eliminación',`Puedes solicitar acceso, rectificación, supresión, limitación, portabilidad y oposición. Puedes retirar el consentimiento de salud en Perfil: la cuenta y la suscripción siguen activas, mientras se eliminan los datos de salud, peso, objetivos, planes y contenido derivado de IA y se bloquean las funciones personalizadas. Puedes volver a consentir, pero los datos eliminados no se recuperan. Elimina cuenta y datos en Perfil o mediante el ${del}procedimiento web</a>. Contacto: ${mail}; respondemos normalmente en un mes. Puedes reclamar ante la autoridad competente.`],
['7. Registro de consentimientos y cambios','Registramos por separado la lectura del aviso y el consentimiento sanitario/IA, con versión, fecha, hora e idioma. Ante cambios sustanciales mostraremos el nuevo aviso y solicitaremos nuevamente el consentimiento cuando proceda.'],
['8. Responsable del tratamiento',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italia<br>Contacto de privacidad: ${mail}`]]],
fr:['Politique de confidentialité','Version 2.3 – 2 septembre 2026','Langue',[
['1. Âge minimum','L’application est exclusivement destinée aux personnes âgées d’au moins 18 ans.'],
['2. Données traitées','Compte; profil, âge, sexe, taille, poids, objectifs et préférences; allergies, intolérances, conditions déclarées, activité, entraînements et sommeil; plans, recettes, notes, historique, favoris et listes; photos Snap & Ask; abonnement et identifiants techniques d’achat. Données techniques minimisées : événements, pannes, performances, appareil, système, version, installation et jetons. La télémétrie ne reçoit ni nom, email, UID Firebase, poids, régime, objectifs ou santé.'],
['3. Finalités et bases','Compte, synchronisation et Premium : contrat (art. 6(1)(b) RGPD). Données de santé et fonctions IA : consentement explicite (arts. 6(1)(a), 9(2)(a)). Firebase Analytics est facultatif et activé uniquement avec le consentement (art. 6(1)(a)); il peut être désactivé à tout moment dans le Profil. Sécurité, prévention des abus et diagnostic strictement nécessaire : intérêt légitime (art. 6(1)(f)). Obligations légales : art. 6(1)(c). Aucune donnée de santé pour publicité ou marketing.'],
['4. IA, photos et prestataires','Les fonctions IA Premium peuvent envoyer profil, préférences, allergies, santé, activité, plan, notes et photo au backend et à Google Gemini API. Les réponses sont informatives, sans diagnostic, traitement ou prescription. L’app ne stocke pas intentionnellement les photos; Google peut les conserver temporairement. Nous utilisons aussi Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring et Google Play Billing.'],
['5. Transferts, conservation et sécurité','Google agit comme sous-traitant pour les services couverts par les accords applicables et peut agir comme responsable indépendant pour certaines données techniques, Analytics et Google Play. Firebase Authentication est fourni depuis les États-Unis. Les autres traitements hors EEE utilisent les garanties du chapitre V du RGPD, notamment les décisions d’adéquation, le Data Privacy Framework lorsqu’il s’applique et les clauses contractuelles types. Pour Gemini lié à un projet avec facturation active, Google déclare ne pas utiliser les requêtes et réponses pour améliorer ses produits, tout en pouvant les journaliser temporairement pour la sécurité, la prévention des abus et les obligations légales. Compte, profil, plans et historique jusqu’à suppression; Analytics selon configuration; Crashlytics normalement 90 jours; achats selon les besoins d’abonnement, droit, litiges et fraude; assistance normalement jusqu’à 24 mois. Nous utilisons chiffrement, authentification, règles par utilisateur, secrets backend et minimisation.'],
['6. Droits, retrait et suppression',`Vous pouvez demander accès, rectification, effacement, limitation, portabilité et opposition. Vous pouvez retirer le consentement santé dans le Profil : compte et abonnement restent actifs, tandis que données de santé, poids, objectifs, plans et contenus IA dérivés sont supprimés et les fonctions personnalisées bloquées. Vous pouvez consentir à nouveau, mais les données supprimées ne sont pas récupérables. Supprimez compte et données dans Profil ou via la ${del}procédure web</a>. Contact : ${mail}; réponse normalement sous un mois. Vous pouvez saisir l’autorité compétente.`],
['7. Preuves de consentement et modifications','Nous enregistrons séparément la prise de connaissance de la notice et le consentement santé/IA, avec version, date, heure et langue. En cas de changement important, nous afficherons la nouvelle notice et demanderons un nouveau consentement si nécessaire.'],
['8. Responsable du traitement',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italie<br>Contact confidentialité : ${mail}`]]],
de:['Datenschutzerklärung','Version 2.3 – 2. September 2026','Sprache',[
['1. Mindestalter','Die App ist ausschließlich für Personen ab 18 Jahren bestimmt.'],
['2. Verarbeitete Daten','Konto; Profil, Alter, Geschlecht, Größe, Gewicht, Ziele und Präferenzen; Allergien, Unverträglichkeiten, angegebene Zustände, Aktivität, Training und Schlaf; Pläne, Rezepte, Notizen, Verlauf, Favoriten und Listen; Snap-&-Ask-Fotos; Abonnement und technische Kaufkennungen. Minimierte technische Daten: Ereignisse, Abstürze, Leistung, Gerät, System, Version, Installation und Token. Telemetrie erhält keinen Namen, E-Mail, Firebase-UID, Gewicht, Ernährung, Ziele oder Gesundheitsdaten.'],
['3. Zwecke und Rechtsgrundlagen','Konto, Synchronisierung und Premium: Vertrag (Art. 6(1)(b) DSGVO). Gesundheitsdaten und KI: ausdrückliche Einwilligung (Art. 6(1)(a), 9(2)(a)). Firebase Analytics ist optional und wird nur mit Einwilligung aktiviert (Art. 6(1)(a)); es kann jederzeit im Profil deaktiviert werden. Sicherheit, Missbrauchsprävention und unbedingt erforderliche Diagnose: berechtigtes Interesse (Art. 6(1)(f)). Rechtspflichten: Art. 6(1)(c). Keine Gesundheitsdaten für Werbung oder Marketing.'],
['4. KI, Fotos und Anbieter','Premium-KI kann Profil, Präferenzen, Allergien, Gesundheit, Aktivität, Plan, Notizen und Foto an Backend und Google Gemini API senden. Antworten sind informativ, keine Diagnose, Behandlung oder Verordnung. Die App speichert Fotos nicht absichtlich; Google kann sie vorübergehend speichern. Außerdem nutzen wir Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring und Google Play Billing.'],
['5. Übermittlungen, Speicherung und Sicherheit','Google handelt für Dienste unter den anwendbaren Vereinbarungen als Auftragsverarbeiter und kann bei bestimmten technischen Daten, Analytics und Google Play eigenständig Verantwortlicher sein. Firebase Authentication wird aus den USA bereitgestellt. Weitere Verarbeitungen außerhalb des EWR erfolgen mit Garantien nach Kapitel V DSGVO, einschließlich Angemessenheitsbeschlüssen, gegebenenfalls Data Privacy Framework und Standardvertragsklauseln. Bei Gemini in einem Projekt mit aktiver Abrechnung erklärt Google, Eingaben und Antworten nicht zur Produktverbesserung zu nutzen; eine begrenzte Protokollierung für Sicherheit, Missbrauchsprävention und rechtliche Pflichten ist möglich. Konto, Profil, Pläne und Verlauf bis Löschung; Analytics gemäß Konfiguration; Crashlytics normalerweise 90 Tage; Käufe nach Bedarf für Abonnement, Recht, Streit und Betrug; Support normalerweise höchstens 24 Monate. Wir nutzen Verschlüsselung, Authentifizierung, Nutzerregeln, Backend-Geheimnisse und Minimierung.'],
['6. Rechte, Widerruf und Löschung',`Sie können Auskunft, Berichtigung, Löschung, Einschränkung, Übertragbarkeit und Widerspruch verlangen. Die Einwilligung für Gesundheitsdaten kann im Profil widerrufen werden: Konto und Abonnement bleiben aktiv, Gesundheitsdaten, Gewicht, Ziele, Pläne und abgeleitete KI-Inhalte werden gelöscht und personalisierte Funktionen gesperrt. Eine erneute Einwilligung ist möglich, gelöschte Daten sind jedoch nicht wiederherstellbar. Löschen Sie Konto und Daten im Profil oder über das ${del}Webverfahren</a>. Kontakt: ${mail}; Antwort normalerweise binnen eines Monats. Beschwerde bei der zuständigen Behörde ist möglich.`],
['7. Einwilligungsnachweise und Änderungen','Kenntnisnahme der Erklärung und Gesundheitsdaten-/KI-Einwilligung werden getrennt mit Version, Datum, Uhrzeit und Sprache erfasst. Bei wesentlichen Änderungen zeigen wir die neue Erklärung und holen erforderlichenfalls erneut Einwilligung ein.'],
['8. Verantwortlicher',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italien<br>Datenschutzkontakt: ${mail}`]]],
zh:['隐私政策','版本 2.3 – 2026年9月2日','语言',[
['1. 最低年龄','本应用仅面向18岁及以上用户。'],
['2. 处理的数据','账户；资料、年龄、性别、身高、体重、目标和偏好；过敏、不耐受、声明的健康状况、活动、训练和睡眠；计划、食谱、备注、历史、收藏和清单；Snap & Ask 照片；订阅和技术购买标识。最小化技术数据包括事件、崩溃、性能、设备、系统、版本、安装标识和通知令牌。遥测不接收姓名、电子邮件、Firebase UID、体重、饮食、目标或健康状况。'],
['3. 目的和法律依据','账户、同步和Premium：履行合同（GDPR 6(1)(b)）。健康数据和AI：明确同意（6(1)(a)、9(2)(a)）。Firebase Analytics为可选功能，仅在获得同意后启用（6(1)(a)），并可随时在个人资料中关闭。安全、防滥用和严格必要的诊断：合法利益（6(1)(f)）。法律义务：6(1)(c)。健康数据不用于广告或营销。'],
['4. AI、照片和服务商','Premium AI可将资料、偏好、过敏、健康、活动、计划、备注和照片发送至后端和Google Gemini API。回复仅供参考，不构成诊断、治疗或处方。应用不主动存储照片；Google可能临时保留。我们还使用Firebase Authentication、Firestore、Cloud Functions、Cloud Messaging、Analytics、Crashlytics、Performance Monitoring和Google Play Billing。'],
['5. 传输、保存和安全','对于适用数据处理协议涵盖的服务，Google作为处理者；对于某些技术数据、Analytics和Google Play，Google可能作为独立控制者。Firebase Authentication从美国提供。欧洲经济区以外的其他处理采用GDPR第五章保障，包括充分性决定、适用时的数据隐私框架和标准合同条款。对于关联有效结算项目的Gemini，Google声明不会使用提示和响应改进产品，但可能因安全、防滥用和法律义务在有限期限内记录。账户、资料、计划和历史保存至删除；Analytics按配置；Crashlytics通常90天；购买数据按订阅、法律、争议和防欺诈需要；支持邮件通常不超过24个月。我们使用传输加密、身份验证、用户访问规则、后端密钥和数据最小化。'],
['6. 权利、撤回与删除',`您可请求访问、更正、删除、限制、可携带和反对。您可在个人资料中撤回健康数据同意：账户和订阅保持有效，但健康数据、体重、目标、计划及衍生AI内容将被删除，个性化功能将被禁用。可以再次同意，但已删除的数据无法恢复。在个人资料中或通过${del}网页程序</a>删除账户和数据。联系：${mail}；通常一个月内回复。您可向主管机构投诉。`],
['7. 同意记录与修改','我们分别记录对隐私声明的确认阅读及健康数据/AI同意，并保存版本、日期、时间和语言。重大修改时会展示新政策，并在必要时重新征得同意。'],
['8. 数据控制者',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italy<br>隐私联系：${mail}`]]],

['2. Dados tratados','Conta; perfil, idade, sexo, altura, peso, objetivos e preferências; alergias, intolerâncias, condições declaradas, atividade, treinos e sono; planos, receitas, notas, histórico, favoritos e listas; fotos Snap & Ask; subscrição e identificadores técnicos de compra. Dados técnicos minimizados: eventos, falhas, desempenho, dispositivo, sistema, versão, instalação e tokens. A telemetria não recebe nome, email, UID Firebase, peso, dieta, objetivos ou saúde.'],
['3. Finalidades e bases','Conta, sincronização e Premium: contrato (art. 6(1)(b) RGPD). Dados de saúde e IA: consentimento explícito (arts. 6(1)(a), 9(2)(a)). O Firebase Analytics é opcional e só é ativado com consentimento (art. 6(1)(a)); pode ser desativado a qualquer momento no Perfil. Segurança, prevenção de abusos e diagnóstico estritamente necessário: interesse legítimo (art. 6(1)(f)). Obrigações legais: art. 6(1)(c). Sem uso de saúde para publicidade ou marketing.'],
['4. IA, fotos e fornecedores','As funções Premium de IA podem enviar perfil, preferências, alergias, saúde, atividade, plano, notas e foto ao backend e Google Gemini API. As respostas são informativas, não diagnóstico, tratamento ou prescrição. A app não guarda intencionalmente fotos; a Google pode conservá-las temporariamente. Usamos ainda Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring e Google Play Billing.'],
['5. Transferências, conservação e segurança','A Google atua como subcontratante nos serviços cobertos pelos acordos aplicáveis e pode atuar como responsável independente para certos dados técnicos, Analytics e Google Play. O Firebase Authentication é prestado a partir dos Estados Unidos. Outros tratamentos fora do EEE usam as garantias do Capítulo V do RGPD, incluindo decisões de adequação, o Data Privacy Framework quando aplicável e Cláusulas Contratuais-Tipo. Com o Gemini associado a um projeto com faturação ativa, a Google declara não usar pedidos e respostas para melhorar os seus produtos, embora possa registá-los temporariamente para segurança, prevenção de abusos e obrigações legais. Conta, perfil, planos e histórico até eliminação; Analytics conforme configuração; Crashlytics normalmente 90 dias; compras conforme subscrição, lei, litígios e fraude; suporte normalmente até 24 meses. Usamos cifragem, autenticação, regras por utilizador, segredos backend e minimização.'],
['6. Direitos, retirada e eliminação',`Pode pedir acesso, retificação, apagamento, limitação, portabilidade e oposição. Pode retirar o consentimento de saúde no Perfil: a conta e a subscrição permanecem ativas, enquanto dados de saúde, peso, objetivos, planos e conteúdos derivados de IA são eliminados e as funções personalizadas bloqueadas. Pode consentir novamente, mas os dados eliminados não são recuperáveis. Elimine conta e dados no Perfil ou pelo ${del}procedimento web</a>. Contacto: ${mail}; resposta normalmente num mês. Pode reclamar à autoridade competente.`],
['7. Registos de consentimento e alterações','Registamos separadamente a leitura do aviso e o consentimento de saúde/IA, incluindo versão, data, hora e idioma. Em alterações substanciais apresentaremos o novo aviso e pediremos novamente consentimento quando necessário.'],
['8. Responsável pelo tratamento',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Itália<br>Contacto de privacidade: ${mail}`]]],
sv:['Integritetspolicy','Version 2.3 – 2 september 2026','Språk',[
['1. Minimiålder','Appen är endast avsedd för personer som är minst 18 år.'],
['2. Uppgifter','Konto; profil, ålder, kön, längd, vikt, mål och preferenser; allergier, intoleranser, angivna tillstånd, aktivitet, träning och sömn; planer, recept, anteckningar, historik, favoriter och listor; Snap & Ask-foton; prenumeration och tekniska köpidentifierare. Minimerade tekniska data: händelser, krascher, prestanda, enhet, system, version, installation och token. Telemetri tar inte emot namn, e-post, Firebase-UID, vikt, kost, mål eller hälsa.'],
['3. Ändamål och grunder','Konto, synkronisering och Premium: avtal (GDPR art. 6.1 b). Hälsodata och AI: uttryckligt samtycke (art. 6.1 a, 9.2 a). Firebase Analytics är valfritt och aktiveras endast med samtycke (art. 6.1 a); det kan stängas av när som helst i Profil. Säkerhet, förebyggande av missbruk och strikt nödvändig diagnostik: berättigat intresse (art. 6.1 f). Rättsliga skyldigheter: art. 6.1 c. Hälsodata används inte för reklam eller marknadsföring.'],
['4. AI, foton och leverantörer','Premium AI kan skicka profil, preferenser, allergier, hälsa, aktivitet, plan, anteckningar och foto till backend och Google Gemini API. Svaren är information, inte diagnos, behandling eller ordination. Appen lagrar inte avsiktligt foton; Google kan behålla dem tillfälligt. Vi använder även Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring och Google Play Billing.'],
['5. Överföring, lagring och säkerhet','Google agerar personuppgiftsbiträde för tjänster som omfattas av tillämpliga avtal och kan vara självständig personuppgiftsansvarig för vissa tekniska data, Analytics och Google Play. Firebase Authentication tillhandahålls från USA. Annan behandling utanför EES sker med skydd enligt kapitel V GDPR, inklusive beslut om adekvat skyddsnivå, Data Privacy Framework när det är tillämpligt och standardavtalsklausuler. För Gemini kopplat till ett projekt med aktiv fakturering uppger Google att frågor och svar inte används för produktförbättring, men begränsad loggning kan ske för säkerhet, missbruksförebyggande och rättsliga skyldigheter. Konto, profil, planer och historik till radering; Analytics enligt inställning; Crashlytics normalt 90 dagar; köp efter behov för prenumeration, lag, tvister och bedrägeri; support normalt högst 24 månader. Vi använder kryptering, autentisering, användarregler, backend-hemligheter och minimering.'],
['6. Rättigheter, återkallelse och radering',`Du kan begära tillgång, rättelse, radering, begränsning, portabilitet och invända. Du kan återkalla samtycke till hälsodata i Profil: konto och prenumeration förblir aktiva, medan hälsodata, vikt, mål, planer och härlett AI-innehåll raderas och personliga funktioner blockeras. Du kan samtycka igen, men raderade data kan inte återställas. Radera konto och data i Profil eller via ${del}webbproceduren</a>. Kontakt: ${mail}; svar normalt inom en månad. Du kan klaga hos behörig myndighet.`],
['7. Samtyckesregister och ändringar','Vi registrerar separat att policyn lästs och samtycke till hälsodata/AI, med version, datum, tid och språk. Vid väsentliga ändringar visar vi den nya policyn och begär nytt samtycke vid behov.'],
['8. Personuppgiftsansvarig',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italien<br>Integritetskontakt: ${mail}`]]],
ar:['سياسة الخصوصية','الإصدار 2.3 – 2 سبتمبر 2026','اللغة',[
['1. الحد الأدنى للعمر','التطبيق مخصص حصريًا لمن يبلغون 18 عامًا على الأقل.'],
['2. البيانات المعالجة','الحساب؛ الملف والعمر والجنس والطول والوزن والأهداف والتفضيلات؛ الحساسية والحالات المعلنة والنشاط والتمارين والنوم؛ الخطط والوصفات والملاحظات والسجل والمفضلة والقوائم؛ صور Snap & Ask؛ الاشتراك ومعرفات الشراء التقنية. بيانات تقنية محدودة: الأحداث والأعطال والأداء والجهاز والنظام والإصدار والتثبيت والرموز. لا يتلقى القياس الاسم أو البريد أو Firebase UID أو الوزن أو النظام الغذائي أو الأهداف أو الصحة.'],
['3. الأغراض والأسس','الحساب والمزامنة وPremium: تنفيذ العقد (GDPR 6(1)(b)). بيانات الصحة والذكاء الاصطناعي: موافقة صريحة (6(1)(a)، 9(2)(a)). خدمة Firebase Analytics اختيارية ولا تُفعّل إلا بالموافقة (6(1)(a))، ويمكن تعطيلها في أي وقت من الملف الشخصي. الأمن ومنع الإساءة والتشخيص الضروري فقط: مصلحة مشروعة (6(1)(f)). الالتزامات القانونية: 6(1)(c). لا تستخدم الصحة للإعلان أو التسويق.'],
['4. الذكاء الاصطناعي والصور والمزودون','قد ترسل ميزات Premium AI الملف والتفضيلات والحساسية والصحة والنشاط والخطة والملاحظات والصورة إلى الخادم وGoogle Gemini API. الردود معلوماتية وليست تشخيصًا أو علاجًا أو وصفة. لا يخزن التطبيق الصور عمدًا؛ وقد تحتفظ بها Google مؤقتًا. نستخدم أيضًا خدمات Firebase وAnalytics وCrashlytics وPerformance Monitoring وGoogle Play Billing.'],
['5. النقل والاحتفاظ والأمن','تعمل Google كمعالج للخدمات المشمولة باتفاقيات المعالجة المعمول بها وقد تعمل كمتحكم مستقل لبعض البيانات التقنية وAnalytics وGoogle Play. تُقدَّم Firebase Authentication من الولايات المتحدة. تخضع المعالجة الأخرى خارج المنطقة الاقتصادية الأوروبية لضمانات الفصل الخامس من GDPR، بما فيها قرارات الملاءمة وإطار خصوصية البيانات عند انطباقه والبنود التعاقدية القياسية. ومع Gemini المرتبط بمشروع ذي فوترة نشطة، تصرح Google بأنها لا تستخدم الطلبات والردود لتحسين منتجاتها، مع إمكانية تسجيلها لفترة محدودة للأمان ومنع إساءة الاستخدام والالتزامات القانونية. الحساب والملف والخطط والسجل حتى الحذف؛ Analytics حسب الإعداد؛ Crashlytics عادة 90 يومًا؛ المشتريات حسب الاشتراك والقانون والنزاعات والاحتيال؛ الدعم عادة حتى 24 شهرًا. نستخدم التشفير والمصادقة وقواعد المستخدم وأسرار الخادم وتقليل البيانات.'],
['6. الحقوق والسحب والحذف',`يمكنك طلب الوصول والتصحيح والحذف والتقييد والنقل والاعتراض. يمكنك سحب الموافقة الصحية من الملف الشخصي: يظل الحساب والاشتراك نشطين، بينما تُحذف بيانات الصحة والوزن والأهداف والخطط ومحتوى الذكاء الاصطناعي المشتق وتُحظر الميزات المخصصة. يمكنك الموافقة مجددًا، لكن لا يمكن استعادة البيانات المحذوفة. احذف الحساب والبيانات من الملف أو عبر ${del}إجراء الويب</a>. التواصل: ${mail}؛ نرد عادة خلال شهر. يمكنك الشكوى للسلطة المختصة.`],
['7. سجلات الموافقة والتغييرات','نسجل بشكل منفصل الإقرار بقراءة الإشعار والموافقة على البيانات الصحية/الذكاء الاصطناعي مع الإصدار والتاريخ والوقت واللغة. وعند التغييرات الجوهرية سنعرض السياسة الجديدة ونطلب الموافقة مجددًا عند الحاجة.'],
['8. المتحكم في البيانات',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italy<br>جهة اتصال الخصوصية: ${mail}`]]],
ru:['Политика конфиденциальности','Версия 2.3 – 2 сентября 2026 г.','Язык',[
['1. Минимальный возраст','Приложение предназначено исключительно для лиц от 18 лет.'],
['2. Данные','Аккаунт; профиль, возраст, пол, рост, вес, цели и предпочтения; аллергии, непереносимости, заявленные состояния, активность, тренировки и сон; планы, рецепты, заметки, история, избранное и списки; фото Snap & Ask; подписка и технические идентификаторы покупок. Минимизированные технические данные: события, сбои, производительность, устройство, система, версия, установка и токены. Телеметрия не получает имя, email, Firebase UID, вес, диету, цели или здоровье.'],
['3. Цели и основания','Аккаунт, синхронизация и Premium: договор (ст. 6(1)(b) GDPR). Данные о здоровье и ИИ: явное согласие (ст. 6(1)(a), 9(2)(a)). Firebase Analytics является необязательным и включается только с согласия (ст. 6(1)(a)); его можно отключить в любое время в профиле. Безопасность, предотвращение злоупотреблений и строго необходимая диагностика: законный интерес (ст. 6(1)(f)). Юридические обязанности: ст. 6(1)(c). Данные о здоровье не используются для рекламы или маркетинга.'],
['4. ИИ, фото и поставщики','Premium AI может передавать профиль, предпочтения, аллергии, здоровье, активность, план, заметки и фото на сервер и в Google Gemini API. Ответы информационные, не диагноз, лечение или назначение. Приложение намеренно не хранит фото; Google может временно их хранить. Также используются Firebase, Analytics, Crashlytics, Performance Monitoring и Google Play Billing.'],
['5. Передача, хранение и безопасность','Google выступает обработчиком для сервисов, охваченных применимыми соглашениями, и может быть самостоятельным оператором для некоторых технических данных, Analytics и Google Play. Firebase Authentication предоставляется из США. Другая обработка вне ЕЭЗ выполняется с гарантиями главы V GDPR, включая решения об адекватности, Data Privacy Framework, где применимо, и Стандартные договорные положения. Для Gemini, связанного с проектом с активным биллингом, Google заявляет, что не использует запросы и ответы для улучшения продуктов, но может временно регистрировать их для безопасности, предотвращения злоупотреблений и исполнения закона. Аккаунт, профиль, планы и история до удаления; Analytics по настройке; Crashlytics обычно 90 дней; покупки по нуждам подписки, закона, споров и мошенничества; поддержка обычно до 24 месяцев. Используются шифрование, аутентификация, правила пользователя, серверные секреты и минимизация.'],
['6. Права, отзыв и удаление',`Вы можете запросить доступ, исправление, удаление, ограничение, переносимость и возражение. Согласие на данные о здоровье можно отозвать в профиле: аккаунт и подписка останутся активными, а данные о здоровье, весе, целях, планы и производный ИИ-контент будут удалены, персонализированные функции заблокированы. Согласие можно дать снова, но удалённые данные не восстанавливаются. Удалите аккаунт и данные в Профиле или через ${del}веб-процедуру</a>. Контакт: ${mail}; ответ обычно в течение месяца. Можно обратиться в компетентный орган.`],
['7. Учёт согласий и изменения','Мы отдельно фиксируем ознакомление с политикой и согласие на данные о здоровье/ИИ, включая версию, дату, время и язык. При существенных изменениях мы покажем новую политику и при необходимости запросим согласие снова.'],
['8. Оператор персональных данных',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Италия<br>Контакт по вопросам конфиденциальности: ${mail}`]]],
ja:['プライバシーポリシー','バージョン2.3 – 2026年9月2日','言語',[
['1. 最低年齢','本アプリは18歳以上の方のみを対象としています。'],
['2. 処理するデータ','アカウント、プロフィール、年齢、性別、身長、体重、目標、設定、アレルギー、申告状態、活動、運動、睡眠、プラン、レシピ、メモ、履歴、お気に入り、リスト、Snap & Ask写真、購読状態、技術的購入識別子を処理します。最小限の技術データはイベント、クラッシュ、性能、端末、OS、版、インストール識別子、通知トークンです。テレメトリに氏名、メール、Firebase UID、体重、食事、目標、健康状態は送りません。'],
['3. 目的と根拠','アカウント、同期、Premiumは契約履行（GDPR 6(1)(b)）。健康データとAIは明示的同意（6(1)(a)、9(2)(a)）。Firebase Analyticsは任意で、同意がある場合のみ有効になります（6(1)(a)）。プロフィールからいつでも無効にできます。安全、不正防止、必要最小限の診断は正当な利益（6(1)(f)）。法的義務は6(1)(c)。健康データを広告やマーケティングに使いません。'],
['4. AI、写真、提供者','Premium AIはプロフィール、設定、アレルギー、健康、活動、プラン、メモ、写真をバックエンドとGoogle Gemini APIへ送る場合があります。回答は情報であり、診断、治療、処方ではありません。アプリは写真を意図的に保存しませんが、Googleが一時保持する場合があります。Firebase、Analytics、Crashlytics、Performance Monitoring、Google Play Billingも利用します。'],
['5. 移転、保存、安全','適用される処理契約の対象サービスではGoogleは処理者として行動し、一部の技術データ、Analytics、Google Playでは独立した管理者となる場合があります。Firebase Authenticationは米国から提供されます。その他のEEA域外処理には、十分性認定、該当する場合のData Privacy Framework、標準契約条項などGDPR第V章の保障措置を適用します。有効な課金設定のプロジェクトに関連付けられたGeminiについて、Googleはプロンプトと応答を製品改善に使用しないとしていますが、安全、不正利用防止、法的義務のため限定期間記録する場合があります。アカウント、プロフィール、プラン、履歴は削除まで、Analyticsは設定期間、Crashlyticsは通常90日、購入は購読・法令・紛争・不正防止に必要な期間、サポートは通常24か月以内です。暗号化、認証、ユーザー規則、バックエンド秘密情報、最小化を用います。'],
['6. 権利、撤回、削除',`アクセス、訂正、削除、制限、移転、異議を請求できます。プロフィールから健康データへの同意を撤回できます。アカウントとサブスクリプションは維持されますが、健康データ、体重、目標、プラン、派生AIコンテンツは削除され、パーソナライズ機能は無効になります。再度同意できますが、削除済みデータは復元できません。プロフィールまたは${del}ウェブ手続</a>でアカウントとデータを削除できます。連絡先：${mail}。通常1か月以内に回答します。管轄機関へ苦情を申し立てられます。`],
['7. 同意記録と変更','プライバシー通知の確認と健康データ・AIへの同意を別々に記録し、バージョン、日時、言語を保存します。重要な変更時は新しい方針を表示し、必要に応じ再同意を求めます。'],
['8. データ管理者',`<b>Leonardo Genna</b><br>Via dei Monti Lepini 121, Cisterna di Latina (LT), Italy<br>プライバシー連絡先：${mail}`]]]};

const advertisingNotice={"it": ["9. Pubblicità e scelte sulla privacy", "Nella versione Android senza accesso Premium mostriamo banner tramite Google AdMob (Google Mobile Ads SDK). Con Premium attivo, inclusa la prova, i banner vengono rimossi e non vengono avviate nuove richieste pubblicitarie. Richiediamo annunci non personalizzati: questo non significa assenza di trattamento dei dati. Google può raccogliere e condividere indirizzo IP (da cui stimare la posizione approssimativa), identificatori del dispositivo o dell’app, interazioni con gli annunci e dati diagnostici, per erogare e misurare gli annunci, analisi e prevenzione delle frodi. Non richiediamo la posizione GPS per gli annunci; nella configurazione Android attuale l’accesso all’ID pubblicitario Android è disabilitato. Non inviamo ad AdMob dati sanitari, peso, obiettivi, preferenze alimentari, fotografie o conversazioni con il coach.", "Usiamo Google User Messaging Platform (UMP) per mostrare i messaggi applicabili alla regione e raccogliere le scelte richieste. Dove previsto, chiediamo il consenso per l’archiviazione o l’accesso a informazioni sul dispositivo e gli altri trattamenti che lo richiedono (art. 6(1)(a) GDPR); sicurezza e prevenzione delle frodi possono basarsi sul legittimo interesse (art. 6(1)(f)), nei limiti applicabili e con diritto di opposizione. Dal collegamento alle opzioni privacy accanto ai banner, quando disponibile, puoi modificare o revocare le scelte; negli Stati USA interessati puoi opporti alla vendita o condivisione dei dati secondo le opzioni mostrate. Rifiutare il consenso non garantisce l’assenza di ogni richiesta tecnica: possono essere disponibili annunci limitati. Le scelte pubblicitarie sono separate dal consenso sanitario e da Firebase Analytics.", "Google e i partner indicati nel messaggio privacy trattano i dati secondo i ruoli, i termini e le informative applicabili. La conservazione varia per finalità e servizio; non promettiamo la cancellazione immediata dei dati già ricevuti da Google quando attivi Premium o elimini l’account. I dati possono essere trattati fuori dal tuo Paese con le garanzie descritte sopra. Dettagli e controlli:"], "en": ["9. Advertising and privacy choices", "In the Android version without Premium access, we display banners through Google AdMob (Google Mobile Ads SDK). Active Premium access, including a trial, removes banners and stops new ad requests. We request non-personalised ads; this does not mean that no data is processed. Google may collect and share IP addresses (to estimate approximate location), device or app identifiers, ad interactions and diagnostic data to deliver and measure ads, perform analytics and prevent fraud. We do not request GPS location for ads; access to the Android advertising ID is disabled in the current Android configuration. We do not send health data, weight, goals, dietary preferences, photographs or coach conversations to AdMob.", "We use Google User Messaging Platform (UMP) to display region-specific messages and collect the required choices. Where required, we ask for consent to store or access information on your device and for other processing requiring consent (GDPR Art. 6(1)(a)); security and fraud prevention may rely on legitimate interests (Art. 6(1)(f)), subject to applicable limits and your right to object. Use the privacy-options link beside banners, when available, to change or withdraw choices. In relevant US states, the displayed options allow you to opt out of the sale or sharing of data. Refusing consent does not guarantee that all technical requests stop: limited ads may be available. Advertising choices are separate from health-data consent and Firebase Analytics.", "Google and the partners listed in the privacy message process data under their applicable roles, terms and notices. Retention varies by purpose and service; enabling Premium or deleting your account does not guarantee immediate deletion of data already received by Google. Data may be processed outside your country under the safeguards described above. Details and controls:"], "es": ["9. Publicidad y opciones de privacidad", "En Android sin acceso Premium mostramos banners mediante Google AdMob (Google Mobile Ads SDK). Premium activo, incluida la prueba, elimina los banners y detiene nuevas solicitudes publicitarias. Solicitamos anuncios no personalizados; esto no significa que no se traten datos. Google puede recopilar y compartir la dirección IP (para estimar la ubicación aproximada), identificadores del dispositivo o de la app, interacciones publicitarias y datos de diagnóstico para mostrar y medir anuncios, realizar análisis y prevenir fraudes. No solicitamos GPS para publicidad; el acceso al ID publicitario de Android está desactivado en la configuración actual. No enviamos a AdMob datos de salud, peso, objetivos, preferencias alimentarias, fotografías ni conversaciones con el coach.", "Usamos Google User Messaging Platform (UMP) para mostrar mensajes según la región y recoger las opciones necesarias. Cuando procede, pedimos consentimiento para almacenar o acceder a información del dispositivo y otros tratamientos que lo requieran (art. 6.1.a RGPD); la seguridad y prevención del fraude pueden basarse en el interés legítimo (art. 6.1.f), dentro de los límites aplicables y con derecho de oposición. El enlace de opciones de privacidad junto a los banners, cuando esté disponible, permite cambiar o retirar las decisiones. En los estados de EE. UU. pertinentes puedes rechazar la venta o el intercambio de datos mediante las opciones mostradas. Rechazar el consentimiento no garantiza que cesen todas las solicitudes técnicas: pueden mostrarse anuncios limitados. Estas decisiones son independientes del consentimiento sanitario y de Firebase Analytics.", "Google y los socios enumerados en el mensaje tratan los datos conforme a sus funciones, términos y avisos aplicables. La conservación depende de la finalidad y el servicio; activar Premium o eliminar la cuenta no garantiza la eliminación inmediata de los datos ya recibidos por Google. Puede haber tratamientos fuera de tu país con las garantías anteriores. Detalles y controles:"], "fr": ["9. Publicité et choix de confidentialité", "Sur Android sans accès Premium, nous affichons des bannières via Google AdMob (Google Mobile Ads SDK). Premium actif, y compris la période d’essai, supprime les bannières et arrête les nouvelles demandes publicitaires. Nous demandons des annonces non personnalisées, ce qui n’exclut pas le traitement de données. Google peut collecter et partager l’adresse IP (pour estimer la position approximative), des identifiants de l’appareil ou de l’application, les interactions publicitaires et des données de diagnostic pour diffuser et mesurer les annonces, effectuer des analyses et prévenir la fraude. Nous ne demandons pas le GPS pour la publicité ; l’accès à l’identifiant publicitaire Android est désactivé dans la configuration actuelle. Nous n’envoyons à AdMob ni données de santé, poids, objectifs, préférences alimentaires, photos ou conversations avec le coach.", "Google User Messaging Platform (UMP) affiche les messages adaptés à la région et recueille les choix requis. Si nécessaire, nous demandons le consentement pour stocker ou consulter des informations sur l’appareil et les autres traitements concernés (art. 6(1)(a) RGPD) ; sécurité et prévention de la fraude peuvent relever de l’intérêt légitime (art. 6(1)(f)), dans les limites applicables et avec droit d’opposition. Le lien des options de confidentialité près des bannières, lorsqu’il est disponible, permet de modifier ou retirer les choix. Dans les États américains concernés, les options affichées permettent de refuser la vente ou le partage des données. Refuser le consentement ne garantit pas l’arrêt de toute requête technique : des annonces limitées peuvent être disponibles. Ces choix sont distincts du consentement santé et de Firebase Analytics.", "Google et les partenaires mentionnés dans le message traitent les données selon leurs rôles, conditions et notices applicables. La conservation varie selon la finalité et le service ; activer Premium ou supprimer le compte ne garantit pas l’effacement immédiat des données déjà reçues par Google. Des traitements hors de votre pays sont possibles avec les garanties décrites plus haut. Détails et contrôles :"], "de": ["9. Werbung und Datenschutzeinstellungen", "Unter Android ohne Premium-Zugang zeigen wir Banner über Google AdMob (Google Mobile Ads SDK). Aktiver Premium-Zugang einschließlich Testphase entfernt Banner und stoppt neue Werbeanfragen. Wir fordern nicht personalisierte Werbung an; dabei können dennoch Daten verarbeitet werden. Google kann IP-Adressen (zur Schätzung des ungefähren Standorts), Geräte- oder App-Kennungen, Werbeinteraktionen und Diagnosedaten für Werbeauslieferung und -messung, Analysen und Betrugsprävention erheben und weitergeben. Wir fordern für Werbung keinen GPS-Standort an; der Zugriff auf die Android-Werbe-ID ist in der aktuellen Konfiguration deaktiviert. Gesundheitsdaten, Gewicht, Ziele, Ernährungspräferenzen, Fotos und Coach-Gespräche werden nicht an AdMob gesendet.", "Google User Messaging Platform (UMP) zeigt regionale Hinweise und erfasst erforderliche Entscheidungen. Soweit erforderlich, bitten wir um Einwilligung zum Speichern oder Abrufen von Geräteinformationen und weiteren einwilligungspflichtigen Verarbeitungen (Art. 6(1)(a) DSGVO). Sicherheit und Betrugsprävention können auf berechtigten Interessen (Art. 6(1)(f)) beruhen, innerhalb geltender Grenzen und mit Widerspruchsrecht. Über den Datenschutz-Link bei den Bannern können Sie, sofern verfügbar, Entscheidungen ändern oder widerrufen. In betreffenden US-Bundesstaaten können Sie über die angezeigten Optionen dem Verkauf oder der Weitergabe von Daten widersprechen. Eine Ablehnung beendet nicht zwingend alle technischen Anfragen: eingeschränkte Werbung kann verfügbar sein. Diese Einstellungen sind von Gesundheitsdaten-Einwilligung und Firebase Analytics getrennt.", "Google und die im Hinweis genannten Partner verarbeiten Daten nach ihren jeweiligen Rollen, Bedingungen und Datenschutzhinweisen. Die Speicherdauer hängt von Zweck und Dienst ab; Premium-Aktivierung oder Kontolöschung garantiert keine sofortige Löschung bereits bei Google eingegangener Daten. Verarbeitungen außerhalb Ihres Landes können mit den oben beschriebenen Garantien erfolgen. Details und Einstellungen:"], "pt": ["9. Publicidade e opções de privacidade", "No Android sem acesso Premium mostramos banners através do Google AdMob (Google Mobile Ads SDK). Premium ativo, incluindo o período experimental, remove os banners e interrompe novos pedidos publicitários. Pedimos anúncios não personalizados; isto não significa ausência de tratamento de dados. A Google pode recolher e partilhar endereço IP (para estimar a localização aproximada), identificadores do dispositivo ou da app, interações publicitárias e dados de diagnóstico para apresentar e medir anúncios, análises e prevenção de fraude. Não pedimos GPS para publicidade; o acesso ao ID publicitário Android está desativado na configuração atual. Não enviamos ao AdMob dados de saúde, peso, objetivos, preferências alimentares, fotografias ou conversas com o coach.", "Usamos Google User Messaging Platform (UMP) para apresentar mensagens regionais e recolher as escolhas necessárias. Quando exigido, pedimos consentimento para guardar ou aceder a informação no dispositivo e para outros tratamentos que o exijam (art. 6(1)(a) RGPD); segurança e prevenção de fraude podem basear-se no interesse legítimo (art. 6(1)(f)), dentro dos limites aplicáveis e com direito de oposição. O link de opções de privacidade junto aos banners, quando disponível, permite alterar ou retirar escolhas. Nos estados dos EUA abrangidos, as opções apresentadas permitem recusar a venda ou partilha de dados. Recusar consentimento não garante o fim de todos os pedidos técnicos: podem estar disponíveis anúncios limitados. Estas escolhas são separadas do consentimento de saúde e do Firebase Analytics.", "A Google e os parceiros indicados na mensagem tratam dados segundo os respetivos papéis, termos e avisos aplicáveis. A conservação varia por finalidade e serviço; ativar Premium ou eliminar a conta não garante a eliminação imediata dos dados já recebidos pela Google. Os dados podem ser tratados fora do seu país com as garantias acima descritas. Detalhes e controlos:"], "sv": ["9. Reklam och integritetsval", "I Android-versionen utan Premium visar vi annonser via Google AdMob (Google Mobile Ads SDK). Aktiv Premium, även provperioden, tar bort annonserna och stoppar nya annonsförfrågningar. Vi begär icke-anpassade annonser; det innebär inte att inga uppgifter behandlas. Google kan samla in och dela IP-adress (för att uppskatta ungefärlig plats), enhets- eller appidentifierare, annonsinteraktioner och diagnostik för annonsvisning, mätning, analys och bedrägeribekämpning. Vi begär inte GPS-plats för annonser; åtkomst till Androids annons-ID är avstängd i nuvarande konfiguration. Vi skickar inte hälsodata, vikt, mål, kostpreferenser, foton eller coachsamtal till AdMob.", "Google User Messaging Platform (UMP) visar regionala meddelanden och samlar in nödvändiga val. Där det krävs ber vi om samtycke för lagring eller åtkomst på enheten och annan samtyckeskrävande behandling (GDPR art. 6.1 a). Säkerhet och bedrägeribekämpning kan grundas på berättigade intressen (art. 6.1 f), inom tillämpliga gränser och med rätt att invända. Via integritetslänken vid annonserna, när tillgänglig, kan du ändra eller återkalla val. I berörda amerikanska delstater kan du avstå från försäljning eller delning av uppgifter via de visade alternativen. Nekat samtycke garanterar inte att alla tekniska förfrågningar upphör: begränsade annonser kan finnas. Valen är separata från hälsosamtycke och Firebase Analytics.", "Google och partnerna som anges i meddelandet behandlar uppgifter enligt sina roller, villkor och integritetspolicyer. Lagringstiden varierar med ändamål och tjänst; Premium eller kontoradering garanterar inte omedelbar radering av data som Google redan fått. Behandling utanför ditt land kan ske med skyddsåtgärderna ovan. Information och kontroller:"], "ru": ["9. Реклама и настройки конфиденциальности", "В Android без доступа Premium мы показываем баннеры через Google AdMob (Google Mobile Ads SDK). Активный Premium, включая пробный период, убирает баннеры и прекращает новые рекламные запросы. Мы запрашиваем неперсонализированную рекламу; это не исключает обработку данных. Google может собирать и передавать IP-адрес (для определения примерного местоположения), идентификаторы устройства или приложения, взаимодействия с рекламой и диагностические данные для показа и измерения рекламы, аналитики и предотвращения мошенничества. Мы не запрашиваем GPS для рекламы; доступ к рекламному ID Android отключён в текущей конфигурации. Данные о здоровье, весе, целях, пищевых предпочтениях, фотографии и беседы с коучем в AdMob не передаются.", "Google User Messaging Platform (UMP) показывает региональные уведомления и получает необходимые решения. Когда требуется, мы запрашиваем согласие на хранение или доступ к информации на устройстве и другие операции, требующие согласия (ст. 6(1)(a) GDPR). Безопасность и борьба с мошенничеством могут опираться на законный интерес (ст. 6(1)(f)), в установленных пределах и с правом возражения. Ссылка настроек конфиденциальности рядом с баннерами, когда доступна, позволяет изменить или отозвать выбор. В соответствующих штатах США можно отказаться от продажи или передачи данных через показанные настройки. Отказ не гарантирует прекращения всех технических запросов: возможна ограниченная реклама. Выбор отделён от согласия на данные о здоровье и Firebase Analytics.", "Google и партнёры, указанные в уведомлении, обрабатывают данные согласно своим ролям, условиям и политикам. Срок хранения зависит от цели и сервиса; включение Premium или удаление аккаунта не гарантирует немедленное удаление данных, уже полученных Google. Возможна обработка за пределами вашей страны с указанными выше гарантиями. Подробности и управление:"], "ar": ["9. الإعلانات وخيارات الخصوصية", "في إصدار Android دون وصول Premium نعرض لافتات عبر Google AdMob ‏(Google Mobile Ads SDK). يزيل Premium النشط، بما فيه الفترة التجريبية، اللافتات ويوقف طلبات الإعلانات الجديدة. نطلب إعلانات غير مخصصة؛ وهذا لا يعني عدم معالجة البيانات. قد تجمع Google وتشارك عنوان IP (لتقدير الموقع التقريبي)، ومعرفات الجهاز أو التطبيق، والتفاعلات مع الإعلانات وبيانات التشخيص لعرض الإعلانات وقياسها والتحليل ومنع الاحتيال. لا نطلب موقع GPS للإعلانات، والوصول إلى معرّف إعلانات Android معطّل في الإعداد الحالي. لا نرسل إلى AdMob بيانات الصحة أو الوزن أو الأهداف أو التفضيلات الغذائية أو الصور أو محادثات المدرب.", "نستخدم Google User Messaging Platform ‏(UMP) لعرض رسائل حسب المنطقة وجمع الخيارات المطلوبة. نطلب الموافقة عند وجوبها لتخزين معلومات على الجهاز أو الوصول إليها وللمعالجات الأخرى التي تتطلبها (GDPR 6(1)(a)). قد يستند الأمن ومنع الاحتيال إلى المصلحة المشروعة (6(1)(f)) ضمن الحدود المطبقة ومع حق الاعتراض. يمكن تعديل الخيارات أو سحبها من رابط خيارات الخصوصية قرب اللافتات عند توفره. في الولايات الأمريكية المعنية تتيح الخيارات المعروضة رفض بيع البيانات أو مشاركتها. رفض الموافقة لا يضمن توقف كل الطلبات التقنية؛ قد تتوفر إعلانات محدودة. هذه الخيارات منفصلة عن الموافقة الصحية وFirebase Analytics.", "تعالج Google والشركاء المذكورون في رسالة الخصوصية البيانات وفق أدوارهم وشروطهم وسياساتهم المطبقة. تختلف مدة الاحتفاظ حسب الغرض والخدمة؛ لا يضمن تفعيل Premium أو حذف الحساب الحذف الفوري لبيانات تلقتها Google سابقًا. قد تُعالج البيانات خارج بلدك بالضمانات المذكورة أعلاه. التفاصيل وأدوات التحكم:"], "zh": ["9. 广告与隐私选择", "在没有Premium权限的Android版本中，我们通过Google AdMob（Google Mobile Ads SDK）显示横幅广告。有效的Premium权限（包括试用期）会移除横幅并停止新的广告请求。我们请求非个性化广告，但这不代表不处理数据。Google可能收集和共享IP地址（用于估算大致位置）、设备或应用标识符、广告互动及诊断数据，以投放和衡量广告、进行分析和防范欺诈。我们不为广告请求GPS位置；当前Android配置已禁用对Android广告ID的访问。我们不会向AdMob发送健康数据、体重、目标、饮食偏好、照片或与教练的对话。", "我们使用Google User Messaging Platform（UMP）展示适用于所在地区的消息并获取所需选择。依法需要时，我们就设备信息的存储或访问及其他需要同意的处理征求同意（GDPR第6(1)(a)条）；安全和防欺诈可能依据合法利益（第6(1)(f)条），受适用限制并享有反对权。横幅旁的隐私选项链接在可用时允许更改或撤回选择。在相关美国州，可通过显示的选项拒绝数据出售或共享。拒绝同意不保证停止所有技术请求：仍可能提供受限广告。这些选择独立于健康数据同意和Firebase Analytics。", "Google及隐私消息中列出的合作伙伴按照各自适用的角色、条款和声明处理数据。保存期限因目的和服务而异；启用Premium或删除账户不保证立即删除Google已收到的数据。数据可能在您所在国家以外处理，并采用上述保障措施。详情与控制："], "ja": ["9. 広告とプライバシーの選択", "Premiumの利用権がないAndroid版では、Google AdMob（Google Mobile Ads SDK）でバナー広告を表示します。有効なPremium（試用期間を含む）ではバナーを削除し、新しい広告リクエストを停止します。非パーソナライズ広告をリクエストしますが、データ処理がなくなるわけではありません。Googleは、広告配信・測定、分析、不正防止のため、IPアドレス（おおよその位置の推定）、端末・アプリ識別子、広告操作、診断データを収集・共有する場合があります。広告のためにGPS位置を要求せず、現在のAndroid設定ではAndroid広告IDへのアクセスを無効にしています。健康データ、体重、目標、食事の好み、写真、コーチとの会話をAdMobに送りません。", "Google User Messaging Platform（UMP）で地域に応じたメッセージを表示し、必要な選択を取得します。必要に応じ、端末情報の保存・アクセス等に同意を求めます（GDPR第6(1)(a)条）。安全・不正防止は、適用上の制限と異議申立権の下で正当な利益（第6(1)(f)条）に基づく場合があります。バナー付近のプライバシー設定リンクが利用できる場合、選択を変更・撤回できます。対象の米国州では、表示される設定からデータの販売・共有を拒否できます。同意の拒否で全ての技術的リクエストが停止するとは限らず、制限付き広告が提供される場合があります。これらは健康データの同意およびFirebase Analyticsと別の選択です。", "Googleとメッセージに記載されたパートナーは、適用される役割、規約、通知に従ってデータを処理します。保存期間は目的・サービスで異なり、Premiumの有効化やアカウント削除によって、Googleが既に受領したデータの即時削除が保証されるわけではありません。上記の保護措置の下で国外処理が行われる場合があります。詳細と設定："]};

const langSelect=document.getElementById('lang'),titleElement=document.getElementById('title'),versionElement=document.getElementById('version'),labelElement=document.getElementById('label'),contentElement=document.getElementById('content');
