it:['Informativa sulla privacy','Versione 2.1 – 2 settembre 2026','Lingua',[
['1. Titolare ed età minima',`Titolare: <b>Leonardo Genna</b>, Via dei Monti Lepini 121, Cisterna di Latina (LT), Italia. Contatto: ${mail}. L’app è destinata a persone di almeno 14 anni.`],
['2. Dati trattati','Account (nome, email, identificativo Firebase); profilo, età, sesso, altezza, peso, obiettivi e preferenze; allergie, intolleranze, condizioni dichiarate, attività, allenamenti e sonno; piani, ricette, note, cronologia, preferiti e liste; foto scelte per Snap & Ask; stato dell’abbonamento e identificativi tecnici degli acquisti. Trattiamo inoltre dati tecnici minimizzati: eventi generici, arresti anomali, prestazioni, dispositivo, sistema operativo, versione, identificativi di installazione e token notifiche. La telemetria non riceve nome, email, UID Firebase, peso, dieta, obiettivi o condizioni sanitarie.'],
['3. Finalità e basi giuridiche','Account, sincronizzazione e Premium: esecuzione del contratto (art. 6(1)(b) GDPR). Personalizzazione con dati sanitari e invio alle funzioni AI: consenso esplicito (artt. 6(1)(a) e 9(2)(a)). Firebase Analytics è facoltativo ed è attivato solo con consenso (art. 6(1)(a)); può essere disattivato in qualsiasi momento dal Profilo. Sicurezza, prevenzione abusi e diagnostica strettamente necessaria: legittimo interesse (art. 6(1)(f)). Obblighi legali: art. 6(1)(c). I dati sanitari non sono usati per pubblicità o marketing.'],
['4. AI, fotografie e fornitori','Le funzioni Premium AI possono inviare al backend e a Google Gemini API profilo, preferenze, allergie, informazioni sulla salute, attività, piano, note e foto selezionata. Le risposte sono informative e non costituiscono diagnosi, terapia o prescrizione. Le foto non sono intenzionalmente archiviate dall’app; Google può conservarle temporaneamente secondo i termini applicabili. Usiamo inoltre Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring e Google Play Billing.'],
['5. Trasferimenti, conservazione e sicurezza','Trattamenti fuori dallo SEE avvengono con le garanzie del Capo V GDPR, incluse decisioni di adeguatezza e Clausole contrattuali standard applicabili. Account, profilo, piani e cronologia restano fino alla cancellazione; Analytics per il periodo configurato; Crashlytics normalmente 90 giorni; acquisti quanto necessario per abbonamento, legge, contestazioni e frodi; email di assistenza normalmente non oltre 24 mesi. Usiamo cifratura in transito, autenticazione, regole per utente, segreti backend e minimizzazione.'],
['6. Diritti e cancellazione',`Puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opposizione e revocare il consenso. Elimina account e dati dal Profilo o tramite la ${del}procedura web</a>. Scrivi a ${mail}; di norma rispondiamo entro un mese. Puoi reclamare al <a href="https://www.garanteprivacy.it/">Garante privacy</a>.`],

en:['Privacy Policy','Version 2.1 – 2 September 2026','Language',[
['1. Controller and minimum age',`Controller: <b>Leonardo Genna</b>, Via dei Monti Lepini 121, Cisterna di Latina (LT), Italy. Contact: ${mail}. The app is intended for people aged 14 or older.`],
['2. Data processed','Account (name, email, Firebase identifier); profile, age, sex, height, weight, goals and preferences; allergies, intolerances, declared conditions, activity, workouts and sleep; plans, recipes, notes, history, favourites and lists; photos selected for Snap & Ask; subscription status and technical purchase identifiers. Minimized technical data includes generic events, crashes, performance, device, OS, version, installation identifiers and notification tokens. Telemetry does not receive name, email, Firebase UID, weight, diet, goals or health conditions.'],
['3. Purposes and legal bases','Account, synchronization and Premium: contract performance (GDPR Art. 6(1)(b)). Personalization using health data and sending it to AI features: explicit consent (Arts. 6(1)(a), 9(2)(a)). Firebase Analytics is optional and is enabled only with consent (Art. 6(1)(a)); it can be disabled at any time in Profile. Security, abuse prevention and strictly necessary diagnostics: legitimate interests (Art. 6(1)(f)). Legal duties: Art. 6(1)(c). Health data is not used for advertising or marketing.'],
['4. AI, photographs and providers','Premium AI features may send profile, preferences, allergies, health information, activity, plan, notes and the selected photo to our backend and Google Gemini API. Responses are informational and are not diagnosis, treatment or prescription. Photos are not intentionally stored by the app; Google may retain them temporarily under applicable terms. We also use Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring and Google Play Billing.'],
['5. Transfers, retention and security','Processing outside the EEA uses GDPR Chapter V safeguards, including applicable adequacy decisions and Standard Contractual Clauses. Account, profile, plans and history remain until deletion; Analytics for the configured period; Crashlytics normally 90 days; purchase data as required for subscriptions, law, disputes and fraud; support email normally no longer than 24 months. We use encryption in transit, authentication, per-user rules, backend secrets and minimization.'],
['6. Rights and deletion',`You may request access, correction, deletion, restriction, portability and objection, and withdraw consent. Delete account and data in Profile or through the ${del}web procedure</a>. Contact ${mail}; we normally respond within one month. You may complain to the competent data protection authority.`],
['7. Changes','For material changes we will display the new notice and request consent again where required. We record the accepted version, date, time and language.']]],
es:['Política de privacidad','Versión 2.1 – 2 de septiembre de 2026','Idioma',[
['1. Responsable y edad mínima',`Responsable: <b>Leonardo Genna</b>, Via dei Monti Lepini 121, Cisterna di Latina (LT), Italia. Contacto: ${mail}. La app está destinada a personas de al menos 14 años.`],
['2. Datos tratados','Cuenta; perfil, edad, sexo, altura, peso, objetivos y preferencias; alergias, intolerancias, condiciones declaradas, actividad, entrenamientos y sueño; planes, recetas, notas, historial, favoritos y listas; fotos para Snap & Ask; suscripción e identificadores técnicos de compra. Datos técnicos minimizados: eventos genéricos, fallos, rendimiento, dispositivo, sistema, versión, instalación y tokens. La telemetría no recibe nombre, email, UID Firebase, peso, dieta, objetivos ni salud.'],
['3. Finalidades y bases','Cuenta, sincronización y Premium: contrato (art. 6.1.b RGPD). Datos de salud y funciones IA: consentimiento explícito (arts. 6.1.a y 9.2.a). Firebase Analytics es opcional y solo se activa con consentimiento (art. 6.1.a); puede desactivarse en cualquier momento desde el Perfil. Seguridad, prevención de abusos y diagnóstico estrictamente necesario: interés legítimo (art. 6.1.f). Obligaciones legales: art. 6.1.c. No usamos datos de salud para publicidad o marketing.'],
['4. IA, fotos y proveedores','Las funciones Premium de IA pueden enviar perfil, preferencias, alergias, salud, actividad, plan, notas y foto al backend y Google Gemini API. Las respuestas son informativas, no diagnóstico, tratamiento ni prescripción. La app no almacena intencionadamente las fotos; Google puede conservarlas temporalmente. Usamos también Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring y Google Play Billing.'],
['5. Transferencias, conservación y seguridad','Las transferencias fuera del EEE usan garantías del capítulo V RGPD. Cuenta, perfil, planes e historial hasta su eliminación; Analytics según configuración; Crashlytics normalmente 90 días; compras según necesidades legales, de suscripción, disputas y fraude; soporte normalmente hasta 24 meses. Usamos cifrado, autenticación, reglas por usuario, secretos backend y minimización.'],
['6. Derechos y eliminación',`Puedes solicitar acceso, rectificación, supresión, limitación, portabilidad y oposición, y retirar el consentimiento. Elimina cuenta y datos en Perfil o mediante el ${del}procedimiento web</a>. Contacto: ${mail}; respondemos normalmente en un mes. Puedes reclamar ante la autoridad competente.`],
['7. Cambios','Ante cambios sustanciales mostraremos el nuevo aviso y solicitaremos nuevamente el consentimiento cuando proceda. Registramos versión, fecha, hora e idioma aceptados.']]],
fr:['Politique de confidentialité','Version 2.1 – 2 septembre 2026','Langue',[
['1. Responsable et âge minimum',`Responsable : <b>Leonardo Genna</b>, Via dei Monti Lepini 121, Cisterna di Latina (LT), Italie. Contact : ${mail}. L’app est destinée aux personnes d’au moins 14 ans.`],
['2. Données traitées','Compte; profil, âge, sexe, taille, poids, objectifs et préférences; allergies, intolérances, conditions déclarées, activité, entraînements et sommeil; plans, recettes, notes, historique, favoris et listes; photos Snap & Ask; abonnement et identifiants techniques d’achat. Données techniques minimisées : événements, pannes, performances, appareil, système, version, installation et jetons. La télémétrie ne reçoit ni nom, email, UID Firebase, poids, régime, objectifs ou santé.'],
['3. Finalités et bases','Compte, synchronisation et Premium : contrat (art. 6(1)(b) RGPD). Données de santé et fonctions IA : consentement explicite (arts. 6(1)(a), 9(2)(a)). Firebase Analytics est facultatif et activé uniquement avec le consentement (art. 6(1)(a)); il peut être désactivé à tout moment dans le Profil. Sécurité, prévention des abus et diagnostic strictement nécessaire : intérêt légitime (art. 6(1)(f)). Obligations légales : art. 6(1)(c). Aucune donnée de santé pour publicité ou marketing.'],
['4. IA, photos et prestataires','Les fonctions IA Premium peuvent envoyer profil, préférences, allergies, santé, activité, plan, notes et photo au backend et à Google Gemini API. Les réponses sont informatives, sans diagnostic, traitement ou prescription. L’app ne stocke pas intentionnellement les photos; Google peut les conserver temporairement. Nous utilisons aussi Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring et Google Play Billing.'],
['5. Transferts, conservation et sécurité','Les transferts hors EEE utilisent les garanties du chapitre V RGPD. Compte, profil, plans et historique jusqu’à suppression; Analytics selon configuration; Crashlytics normalement 90 jours; achats selon les besoins d’abonnement, droit, litiges et fraude; assistance normalement jusqu’à 24 mois. Nous utilisons chiffrement, authentification, règles par utilisateur, secrets backend et minimisation.'],
['6. Droits et suppression',`Vous pouvez demander accès, rectification, effacement, limitation, portabilité et opposition, et retirer votre consentement. Supprimez compte et données dans Profil ou via la ${del}procédure web</a>. Contact : ${mail}; réponse normalement sous un mois. Vous pouvez saisir l’autorité compétente.`],
['7. Modifications','En cas de changement important, nous afficherons la nouvelle notice et demanderons un nouveau consentement si nécessaire. Nous enregistrons version, date, heure et langue acceptées.']]],
de:['Datenschutzerklärung','Version 2.1 – 2. September 2026','Sprache',[

['2. Verarbeitete Daten','Konto; Profil, Alter, Geschlecht, Größe, Gewicht, Ziele und Präferenzen; Allergien, Unverträglichkeiten, angegebene Zustände, Aktivität, Training und Schlaf; Pläne, Rezepte, Notizen, Verlauf, Favoriten und Listen; Snap-&-Ask-Fotos; Abonnement und technische Kaufkennungen. Minimierte technische Daten: Ereignisse, Abstürze, Leistung, Gerät, System, Version, Installation und Token. Telemetrie erhält keinen Namen, E-Mail, Firebase-UID, Gewicht, Ernährung, Ziele oder Gesundheitsdaten.'],
['3. Zwecke und Rechtsgrundlagen','Konto, Synchronisierung und Premium: Vertrag (Art. 6(1)(b) DSGVO). Gesundheitsdaten und KI: ausdrückliche Einwilligung (Art. 6(1)(a), 9(2)(a)). Firebase Analytics ist optional und wird nur mit Einwilligung aktiviert (Art. 6(1)(a)); es kann jederzeit im Profil deaktiviert werden. Sicherheit, Missbrauchsprävention und unbedingt erforderliche Diagnose: berechtigtes Interesse (Art. 6(1)(f)). Rechtspflichten: Art. 6(1)(c). Keine Gesundheitsdaten für Werbung oder Marketing.'],
['4. KI, Fotos und Anbieter','Premium-KI kann Profil, Präferenzen, Allergien, Gesundheit, Aktivität, Plan, Notizen und Foto an Backend und Google Gemini API senden. Antworten sind informativ, keine Diagnose, Behandlung oder Verordnung. Die App speichert Fotos nicht absichtlich; Google kann sie vorübergehend speichern. Außerdem nutzen wir Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging, Analytics, Crashlytics, Performance Monitoring und Google Play Billing.'],
['5. Übermittlungen, Speicherung und Sicherheit','Übermittlungen außerhalb des EWR nutzen Garantien nach Kapitel V DSGVO. Konto, Profil, Pläne und Verlauf bis Löschung; Analytics gemäß Konfiguration; Crashlytics normalerweise 90 Tage; Käufe nach Bedarf für Abonnement, Recht, Streit und Betrug; Support normalerweise höchstens 24 Monate. Wir nutzen Verschlüsselung, Authentifizierung, Nutzerregeln, Backend-Geheimnisse und Minimierung.'],
['6. Rechte und Löschung',`Sie können Auskunft, Berichtigung, Löschung, Einschränkung, Übertragbarkeit und Widerspruch verlangen sowie Einwilligung widerrufen. Löschen Sie Konto und Daten im Profil oder über das ${del}Webverfahren</a>. Kontakt: ${mail}; Antwort normalerweise binnen eines Monats. Beschwerde bei der zuständigen Behörde ist möglich.`],

['6. 权利和删除',`您可请求访问、更正、删除、限制、可携带和反对，并撤回同意。在个人资料中或通过${del}网页程序</a>删除账户和数据。联系：${mail}；通常一个月内回复。您可向主管机构投诉。`],

['3. الأغراض والأسس','الحساب والمزامنة وPremium: تنفيذ العقد (GDPR 6(1)(b)). بيانات الصحة والذكاء الاصطناعي: موافقة صريحة (6(1)(a)، 9(2)(a)). خدمة Firebase Analytics اختيارية ولا تُفعّل إلا بالموافقة (6(1)(a))، ويمكن تعطيلها في أي وقت من الملف الشخصي. الأمن ومنع الإساءة والتشخيص الضروري فقط: مصلحة مشروعة (6(1)(f)). الالتزامات القانونية: 6(1)(c). لا تستخدم الصحة للإعلان أو التسويق.'],

['5. النقل والاحتفاظ والأمن','النقل خارج المنطقة الاقتصادية الأوروبية يخضع لضمانات الفصل الخامس من GDPR. الحساب والملف والخطط والسجل حتى الحذف؛ Analytics حسب الإعداد؛ Crashlytics عادة 90 يومًا؛ المشتريات حسب الاشتراك والقانون والنزاعات والاحتيال؛ الدعم عادة حتى 24 شهرًا. نستخدم التشفير والمصادقة وقواعد المستخدم وأسرار الخادم وتقليل البيانات.'],
['6. الحقوق والحذف',`يمكنك طلب الوصول والتصحيح والحذف والتقييد والنقل والاعتراض وسحب الموافقة. احذف الحساب والبيانات من الملف أو عبر ${del}إجراء الويب</a>. التواصل: ${mail}؛ نرد عادة خلال شهر. يمكنك الشكوى للسلطة المختصة.`],

ru:['Политика конфиденциальности','Версия 2.1 – 2 сентября 2026 г.','Язык',[

['2. Данные','Аккаунт; профиль, возраст, пол, рост, вес, цели и предпочтения; аллергии, непереносимости, заявленные состояния, активность, тренировки и сон; планы, рецепты, заметки, история, избранное и списки; фото Snap & Ask; подписка и технические идентификаторы покупок. Минимизированные технические данные: события, сбои, производительность, устройство, система, версия, установка и токены. Телеметрия не получает имя, email, Firebase UID, вес, диету, цели или здоровье.'],
['3. Цели и основания','Аккаунт, синхронизация и Premium: договор (ст. 6(1)(b) GDPR). Данные о здоровье и ИИ: явное согласие (ст. 6(1)(a), 9(2)(a)). Firebase Analytics является необязательным и включается только с согласия (ст. 6(1)(a)); его можно отключить в любое время в профиле. Безопасность, предотвращение злоупотреблений и строго необходимая диагностика: законный интерес (ст. 6(1)(f)). Юридические обязанности: ст. 6(1)(c). Данные о здоровье не используются для рекламы или маркетинга.'],
['4. ИИ, фото и поставщики','Premium AI может передавать профиль, предпочтения, аллергии, здоровье, активность, план, заметки и фото на сервер и в Google Gemini API. Ответы информационные, не диагноз, лечение или назначение. Приложение намеренно не хранит фото; Google может временно их хранить. Также используются Firebase, Analytics, Crashlytics, Performance Monitoring и Google Play Billing.'],
['5. Передача, хранение и безопасность','Передача вне ЕЭЗ использует гарантии главы V GDPR. Аккаунт, профиль, планы и история до удаления; Analytics по настройке; Crashlytics обычно 90 дней; покупки по нуждам подписки, закона, споров и мошенничества; поддержка обычно до 24 месяцев. Используются шифрование, аутентификация, правила пользователя, серверные секреты и минимизация.'],
['6. Права и удаление',`Вы можете запросить доступ, исправление, удаление, ограничение, переносимость и возражение, а также отозвать согласие. Удалите аккаунт и данные в Профиле или через ${del}веб-процедуру</a>. Контакт: ${mail}; ответ обычно в течение месяца. Можно обратиться в компетентный орган.`],
['7. Изменения','При существенных изменениях мы покажем новую политику и при необходимости запросим согласие снова. Мы фиксируем версию, дату, время и язык.']]],
ja:['プライバシーポリシー','バージョン2.1 – 2026年9月2日','言語',[

['2. 処理するデータ','アカウント、プロフィール、年齢、性別、身長、体重、目標、設定、アレルギー、申告状態、活動、運動、睡眠、プラン、レシピ、メモ、履歴、お気に入り、リスト、Snap & Ask写真、購読状態、技術的購入識別子を処理します。最小限の技術データはイベント、クラッシュ、性能、端末、OS、版、インストール識別子、通知トークンです。テレメトリに氏名、メール、Firebase UID、体重、食事、目標、健康状態は送りません。'],
['3. 目的と根拠','アカウント、同期、Premiumは契約履行（GDPR 6(1)(b)）。健康データとAIは明示的同意（6(1)(a)、9(2)(a)）。Firebase Analyticsは任意で、同意がある場合のみ有効になります（6(1)(a)）。プロフィールからいつでも無効にできます。安全、不正防止、必要最小限の診断は正当な利益（6(1)(f)）。法的義務は6(1)(c)。健康データを広告やマーケティングに使いません。'],
['4. AI、写真、提供者','Premium AIはプロフィール、設定、アレルギー、健康、活動、プラン、メモ、写真をバックエンドとGoogle Gemini APIへ送る場合があります。回答は情報であり、診断、治療、処方ではありません。アプリは写真を意図的に保存しませんが、Googleが一時保持する場合があります。Firebase、Analytics、Crashlytics、Performance Monitoring、Google Play Billingも利用します。'],
['5. 移転、保存、安全','EEA域外移転にはGDPR第V章の保障措置を適用します。アカウント、プロフィール、プラン、履歴は削除まで、Analyticsは設定期間、Crashlyticsは通常90日、購入は購読・法令・紛争・不正防止に必要な期間、サポートは通常24か月以内です。暗号化、認証、ユーザー規則、バックエンド秘密情報、最小化を用います。'],
['6. 権利と削除',`アクセス、訂正、削除、制限、移転、異議、同意撤回を請求できます。プロフィールまたは${del}ウェブ手続</a>でアカウントとデータを削除できます。連絡先：${mail}。通常1か月以内に回答します。管轄機関へ苦情を申し立てられます。`],
['7. 変更','重要な変更時は新しい方針を表示し、必要に応じ再同意を求めます。承認版、日付、時刻、言語を記録します。']]]};
const langSelect=document.getElementById('lang'),titleElement=document.getElementById('title'),versionElement=document.getElementById('version'),labelElement=document.getElementById('label'),contentElement=document.getElementById('content');
function render(c){let p=P[c]||P.it;document.documentElement.lang=c;document.documentElement.dir=c==='ar'?'rtl':'ltr';langSelect.value=c;titleElement.textContent=p[0];versionElement.textContent=p[1];labelElement.textContent=p[2];document.title=p[0]+' | AI Nutrition Coach';contentElement.innerHTML=p[3].map(x=>`<section class="card"><h2>${x[0]}</h2><p>${x[1]}</p></section>`).join('');localStorage.setItem('legalLanguage',c)}
let saved=localStorage.getItem('legalLanguage'),browser=(navigator.language||'it').slice(0,2).toLowerCase();render(P[saved]?saved:(P[browser]?browser:'it'));langSelect.onchange=e=>render(e.target.value);
</script></body></html>
